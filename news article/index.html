<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Outdoor Dining News Coverage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        .photo-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.9);
        }
        .photo {
            position: absolute;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            width: 800px;
            height: auto;
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            background-color: white;
            padding: 20px;
            z-index: 1;
        }
        .photo.visible {
            opacity: 1;
            transform: scale(1);
        }
        @media (max-width: 900px) {
            .photo {
                width: 600px;
                padding: 15px;
            }
        }
        @media (max-width: 768px) {
            .photo {
                width: 90%;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="photo-container" id="photoContainer"></div>
    <script src="scripts.js"></script>
</body>
</html>
